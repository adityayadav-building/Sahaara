services:
  - type: web
    name: sahaara
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_FALLBACK_PROVIDER
        value: mock
      - key: LLM_TEMPERATURE
        value: "0.7"
      - key: LLM_MAX_TOKENS
        value: "550"
      - key: SHOW_BOOK_EXCERPTS
        value: "1"
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_TTS_MODEL
        value: timbre-v3.0
      - key: GNANI_TTS_SPEED
        value: "0.95"
      - key: GNANI_TTS_SAMPLE_RATE
        value: "48000"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
